# Tema ivencore — color principal: teal #009991
@accentColor   = #00e39b
@accentHover   = #007d77
@accentPressed = #006b65

TitlePane.unifiedBackground = false
TitlePane.buttonSize        = 35,23

Component.focusWidth  = 2
Component.focusColor  = @accentColor
Component.arc         = 10
Button.arc            = 12
TextComponent.arc     = 10
Button.margin         = 4,10,4,10

Button.default.background         = @accentColor
Button.default.foreground         = #ffffff
Button.default.boldText           = true
Button.default.hoverBackground    = @accentHover
Button.default.pressedBackground  = @accentPressed
Button.default.borderColor        = @accentColor
Button.default.focusedBorderColor = @accentColor
Button.default.hoverBorderColor   = @accentHover

CheckBox.icon.selectedBackground           = @accentColor
CheckBox.icon.selectedFocusedBackground    = @accentHover
RadioButton.icon.selectedBackground        = @accentColor
ProgressBar.foreground                     = @accentColor
Slider.thumbColor                          = @accentColor
Slider.trackValueColor                     = @accentColor
ScrollBar.hoverThumbColor                  = @accentColor
ScrollBar.pressedThumbColor                = @accentHover

# Tabla — fila seleccionada en teal
Table.selectionBackground = @accentColor
Table.selectionForeground = #ffffff
List.selectionBackground  = @accentColor
List.selectionForeground  = #ffffff

# SVG icons: currentColor maps to Button.foreground which auto-adapts to theme
# In light mode buttons have dark text, in dark mode they have light text
Button.toolbar.foreground        = #1e293b
[dark]Button.toolbar.foreground  = #f1f5f9
